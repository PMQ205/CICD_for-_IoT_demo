name: IoT CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients

      - name: Start MQTT Broker
        run: |
          mosquitto -d

      - name: Start Device Simulator
        run: |
          nohup python -m app.device_simulator > device.log 2>&1 &

      - name: Start API
        run: |
          nohup uvicorn app.api:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &

      - name: Wait for services
        run: |
          sleep 5

      - name: Run integration tests
        run: |
          python -m pytest -v -s tests/test_integration.py

      - name: Create release package
        if: success()
        run: |
          zip -r iot-cicd-demo.zip app tests requirements.txt

      - name: Upload release package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iot-cicd-release
          path: iot-cicd-demo.zip

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iot-test-logs
          path: |
            device.log
            api.log
            iot.db
  hil:
    needs: test
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Python dependency
        run: |
          python -m pip install pyserial

      - name: Build ESP32 firmware
        working-directory: esp32-hil-demo
        run: |
          pio run

      - name: Flash ESP32
        working-directory: esp32-hil-demo
        run: |
          pio run -t upload

      - name: Wait for ESP32
        run: |
          Start-Sleep -Seconds 3

      - name: Run HIL test
        working-directory: esp32-hil-demo
        run: |
          python hil_test.py

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-hil-firmware
          path: esp32-hil-demo/.pio/build/esp32-s3/firmware.bin